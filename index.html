    <title>Fahad Electronics | Premium Home Appliances</title>
    <meta name="description" content="Shop the latest home appliances, LED TVs, refrigerators, and air conditioners at Fahad Electronics. Premium Quality, Trusted Service." />
    
    <!-- Open Graph / Facebook -->

    <meta property="og:title" content="Fahad Electronics | Premium Home Appliances" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://fahadelectronics.pk/" />
    <meta property="twitter:title" content="Fahad Electronics | Premium Home Appliances" />

    <meta property="twitter:image" content="/og-image.png" />

    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&') 
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
