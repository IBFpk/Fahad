<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="text/javascript">
      try {
        var cached = localStorage.getItem('cached_brand_settings');
        if (cached) {
          var settings = JSON.parse(cached);
          if (settings && settings.businessName) {
            document.title = settings.businessName + " | " + (settings.businessSub || 'Premium Store');
          }
        }
      } catch (e) {
        console.error(e);
      }
    </script>
    <title>Fahad Electronics | Premium Home Appliances</title>
    <meta name="description" content="Shop the latest home appliances, LED TVs, refrigerators, and air conditioners at Fahad Electronics. Premium Quality, Trusted Service." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fahadelectronics.pk/" />
    <meta property="og:site_name" content="Fahad Electronics" />
    <meta property="og:title" content="Fahad Electronics | Premium Home Appliances in Pakistan" />
    <meta property="og:description" content="Shop the latest home appliances, LED TVs, refrigerators, and air conditioners at Fahad Electronics. Experience premium quality and trusted service." />
    <meta property="og:image" content="https://lh3.googleusercontent.com/d/16tFR0xRBzwAjyhyD0o6UWSH2SOCm1lv5" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="600" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://fahadelectronics.pk/" />
    <meta property="twitter:title" content="Fahad Electronics | Premium Home Appliances" />
    <meta property="twitter:description" content="Shop the latest home appliances, LED TVs, refrigerators, and air conditioners at Fahad Electronics. Premium Quality, Trusted Service." />
    <meta property="twitter:image" content="https://lh3.googleusercontent.com/d/16tFR0xRBzwAjyhyD0o6UWSH2SOCm1lv5" />

    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&') 
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
